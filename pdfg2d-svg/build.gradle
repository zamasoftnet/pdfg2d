description = 'SVG and Emoji support'

dependencies {
    implementation project(':pdfg2d-pdf')
    implementation project(':pdfg2d-core')
    implementation project(':pdfg2d-font')
    implementation 'org.apache.xmlgraphics:batik-bridge:1.19'
    implementation 'org.apache.xmlgraphics:batik-anim:1.19'
    implementation 'xml-apis:xml-apis:1.4.01'
    // fr.sertelon.media:jpeg-cmyk は撤去(2026-08-10)。CMYK JPEGは
    // imageio-jpeg(TwelveMonkeys)が正しく扱う。sertelonのリーダは
    // JDKの内部API(com.sun.imageio)へ--add-exports無しにアクセスして
    // IllegalAccessErrorで変換全体を落とすうえ、ImageFlow/
    // RasterImageLoaderの選好ロジックがTwelveMonkeysより先に
    // これを選んでしまう(asahicom.jpのYCCK JPEGで実測)
    // Emoji fonts resource - users need this JAR at runtime for emoji support
    runtimeOnly project(':pdfg2d-svg-emoji')
}

publishing {
    publications {
        maven(MavenPublication) {
            pom {
                description = 'SVG and Emoji support'
                url = 'https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-svg'
                
                scm {
                    connection = 'scm:git:https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-svg'
                    developerConnection = 'scm:git:https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-svg'
                    url = 'https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-svg'
                }
            }
        }
    }
}
