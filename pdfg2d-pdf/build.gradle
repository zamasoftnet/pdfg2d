description = 'PDF output implementation'

dependencies {
    implementation project(':pdfg2d-core')
    implementation 'net.zamasoft:zstream-resolver:1.0.0-SNAPSHOT'
    implementation 'net.zamasoft:zstream-io:1.0.0-SNAPSHOT'
    implementation project(':pdfg2d-font')
    implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.13.1'
    // WebP入力(2026-08-18)。実Webの画像はwebpが主流になっており、未対応だと
    // 代替テキストへ退行して版面が崩れる(bbc-news/bbc-japanで実測)
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.13.1'
    implementation 'com.drewnoakes:metadata-extractor:2.20.0'

    // Batikが作る子Graphics2Dの状態復元をこのモジュールで回帰検査する。
    testImplementation project(':pdfg2d-svg')
    testImplementation 'org.apache.xmlgraphics:batik-bridge:1.19'
    testImplementation 'org.apache.xmlgraphics:batik-anim:1.19'
}

publishing {
    publications {
        maven(MavenPublication) {
            pom {
                description = 'PDF output implementation'
                url = 'https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-pdf'
                
                scm {
                    connection = 'scm:git:https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-pdf'
                    developerConnection = 'scm:git:https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-pdf'
                    url = 'https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-pdf'
                }
            }
        }
    }
}
