description = 'Font library'

// **WOFF2 の伸長にだけ Brotli を使う**(2026-08-05)。それ以外に外部依存は無い。
// WOFF2 は WOFF と違って zlib ではなく Brotli で圧縮されており、
// Java 標準ライブラリに伸長器が無いため純Javaの実装を1つだけ足している。
dependencies {
    implementation 'org.brotli:dec:0.1.2'
}

publishing {
    publications {
        maven(MavenPublication) {
            pom {
                description = 'Font library'
                url = 'https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-font'
                
                scm {
                    connection = 'scm:git:https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-font'
                    developerConnection = 'scm:git:https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-font'
                    url = 'https://github.com/mimidesunya/pdfg2d/tree/main/pdfg2d-font'
                }
            }
        }
    }
}
