plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'pdfg2d'

// zstream provides net.zamasoft:zstream-io and net.zamasoft:zstream-resolver.
// GitHub: https://github.com/zamasoftnet/zstream
includeBuild '../zstream'

include 'pdfg2d-font'
include 'pdfg2d-core'
include 'pdfg2d-pdf'
include 'pdfg2d-svg'
include 'pdfg2d-svg-emoji'
include 'pdfg2d-demo'
